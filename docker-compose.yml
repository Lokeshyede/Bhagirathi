version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: bhagirathi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bhagirathi_pg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bhagirathi_backend
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bhagirathi_pg
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  frontend-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: bhagirathi_frontend_admin
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

  frontend-tenant:
    build:
      context: .
      dockerfile: docker/Dockerfile.tenant
    container_name: bhagirathi_frontend_tenant
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: always

  frontend-maintenance:
    build:
      context: .
      dockerfile: docker/Dockerfile.maintenance
    container_name: bhagirathi_frontend_maintenance
    ports:
      - "8083:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
